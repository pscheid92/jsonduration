name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Nightly: catches new Go releases and vulnerabilities, and gives the fuzzers a longer run.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just fix-check
      - run: just vet
      - run: just actionlint
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - run: just coverage
      - name: Coverage is 100%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" != "100.0%" ]; then
            go tool cover -func=coverage.out | grep -v '100.0%' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::coverage is $total, want 100.0%"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go: [ "1.27.x" ] # the minimum in go.mod
        include:
          - os: ubuntu-latest
            go: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just test

  test-32bit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just test-32bit

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [ FuzzRoundTrip, FuzzParse, FuzzParseMatchesReference, FuzzUnmarshal, FuzzUnitsMatchesParseDuration ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # The inputs a fuzzer found interesting, kept from run to run so that each run builds on the ones before.
      # A cache entry cannot be overwritten, so every run saves a new one and restores the latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - run: just fuzz "$FUZZTIME" "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '45s' }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Against the latest Go release, which a new user of the module builds with.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          check-latest: true
          cache: false

  # Publishes the measured coverage for the README badge, also when it drops below 100%, as a shields.io endpoint file
  # on the badges branch.
  coverage-badge:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just coverage
      - name: Publish the badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          color=$(awk -v t="${total%\%}" 'BEGIN {
            print (t >= 100 ? "brightgreen" : t >= 90 ? "green" : t >= 75 ? "yellow" : "red")
          }')
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' "$total" "$color" \
            > coverage.json
          # One fresh commit each time, force-pushed, so the branch never grows.
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage ${total} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
          echo "### Coverage badge: ${total}" >> "$GITHUB_STEP_SUMMARY"

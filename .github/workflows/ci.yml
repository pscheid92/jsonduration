name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Mondays: catches new Go releases, new vulnerabilities, and gives the fuzzers a longer run.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ "1.27.x" ] # the minimum in go.mod
        include:
          - os: ubuntu-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - name: Test
        shell: bash
        # -race is skipped on Windows so the job does not depend on the
        # runner's C toolchain; Linux and macOS cover the race detector.
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        shell: bash
        env:
          MIN_COVERAGE: "100"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t < m) }'; then
            go tool cover -func=coverage.out | grep -v '100.0%' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::coverage ${total}% is below ${MIN_COVERAGE}%"
            exit 1
          fi

  coverage-badge:
    # Publishes the measured coverage for the badge in README.md, as a shields.io endpoint file on the badges branch,
    # which holds nothing else. It publishes whatever the tests measure, independent of the threshold the test job
    # enforces, so the badge also shows a drop.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Publish the badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          color=$(awk -v t="${total%\%}" 'BEGIN { print (t >= 100 ? "brightgreen" : t >= 90 ? "green" : t >= 75 ? "yellow" : "red") }')
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' "$total" "$color" > coverage.json
          # One fresh commit each time, force-pushed, so the branch never grows.
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage ${total} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
          echo "### Coverage badge: ${total}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: Generated code is up to date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::run 'just generate' and commit the result"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      # Checks the code against the latest Go release, which is what a new
      # user of the module would build with.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          check-latest: true
          cache: false # no dependencies to cache

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [ FuzzRoundTrip, FuzzParse, FuzzUnmarshal, FuzzUnitsMatchesParseDuration ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '45s' }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" .
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz

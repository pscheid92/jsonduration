name: Release

# Push a tag such as v0.1.0 (or v0.2.0-rc.1 for a pre-release):
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -race -count=1 ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
      - name: Announce to the Go module proxy
        env:
          TAG: ${{ github.ref_name }}
        # Fetching the version through the proxy makes pkg.go.dev index it.
        run: curl -fsS "https://proxy.golang.org/$(go list -m)/@v/${TAG}.info"
